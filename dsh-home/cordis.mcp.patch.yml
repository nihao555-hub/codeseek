# 由 scripts/assemble-toolkit.mjs sync 生成。不要手改；改 toolkit/catalog.json 或 toolkit/enabled.json。
# 每个 MCP 默认关闭：有对应密钥、或 MCP_<FLAG>=1、或写入 enabled.json 后才会加载。
# 工具名形如 mcp__<serverName>__<rawName>。
# web-search-codeseek 把官方 web_search 接到本地 SearXNG/DuckDuckGo。

- insert:
    - id: mcp-meta-ads
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!(process.env.MCP_META_ADS === '1' || Boolean(process.env.META_ACCESS_TOKEN))"
      config:
        serverName: meta-ads
        transport: streamable-http
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        url: "https://mcp.facebook.com/ads"
        headers: !!js "process.env.META_ACCESS_TOKEN ? { \"Authorization\": 'Bearer ' + process.env.META_ACCESS_TOKEN } : {}"
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
    - id: mcp-web-search
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!(true || process.env.MCP_WEB_SEARCH === '1')"
      config:
        serverName: web-search
        transport: stdio
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        command: node
        args:
          - !!js "(process.env.DSH_WORKSPACE || '/workspace') + '/scripts/web-search-mcp.mjs'"
        env:
          SEARXNG_URL: !!js "process.env.SEARXNG_URL || 'https://searx.tiekoetter.com;https://priv.au;https://search.ononoki.org;https://opnxng.com;https://paulgo.io'"
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
    - id: mcp-buyer-dd
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!(true || process.env.MCP_BUYER_DD === '1')"
      config:
        serverName: buyer-dd
        transport: stdio
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        command: node
        args:
          - !!js "(process.env.DSH_WORKSPACE || '/workspace') + '/scripts/buyer-dd-mcp.mjs'"
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!(process.env.MCP_GITHUB === '1' || Boolean(process.env.GITHUB_TOKEN) || Boolean(process.env.GITHUB_PERSONAL_ACCESS_TOKEN))"
      config:
        serverName: github
        transport: stdio
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        command: npx
        args:
          - -y
          - "@modelcontextprotocol/server-github"
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: !!js "process.env.GITHUB_PERSONAL_ACCESS_TOKEN || process.env.GITHUB_TOKEN || ''"
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
    - id: mcp-github-official
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!(process.env.MCP_GITHUB_OFFICIAL === '1' || Boolean(process.env.GITHUB_TOKEN))"
