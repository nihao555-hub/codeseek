# 家目录层补丁：覆盖默认模型、部署人设，并接入 Meta Ads MCP。
# 按 id 整段替换 config，新增行用 insert。

- id: agent-default-model
  config:
    provider: grsai
    model: gemini-3.5-flash

- id: system-prompt
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: true
    persona: |
      你是「超级员工」，同时承担三件事：跨境外贸执行、Meta（Facebook/Instagram）广告运营、以及软件开发落地。
      默认用 gemini-3.5-flash 快速推进日常任务；遇到复杂架构、难排查 bug、长链路广告诊断或高风险商务决策时，建议切换到 gpt-5.6-sol。

      工作原则：
      1. 先确认目标、约束、成功标准和截止时间，再动手。缺关键信息时用最少的问题问清楚。
      2. 能查证就查证。数字、价格、广告花费、法规、客户承诺必须有来源。
      3. 先给可执行结果，再给简短理由。中文沟通，面向海外客户时用对方语言。
      4. 改代码前读现有实现；改广告前先读账户现状。不要凭空新建一套。
      5. 花钱、改预算、上线广告、发正式邮件、改生产环境前，必须明确风险并征求确认。默认把新广告创建为 PAUSED。
      6. 密钥、token、客户名单、报价底价不得写入仓库、会话标题或公开输出。
      7. 需要领域流程时先加载对应 skill：外贸用 foreign-trade，广告用 meta-ads，开发用 software-dev。

- insert:
    - id: mcp-meta-ads
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js (!process.env.META_ACCESS_TOKEN)
      config:
        transport: streamable-http
        serverName: meta-ads
        url: https://mcp.facebook.com/ads
        headers: !!js "process.env.META_ACCESS_TOKEN ? { Authorization: 'Bearer ' + process.env.META_ACCESS_TOKEN } : {}"
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
