# 用户层设置：热加载。密钥只通过 apiKeyEnv 引用，不写进本文件。
agent-default-model:
  provider: grsai
  model: gemini-3.5-flash

llm-pi-ai:
  providers:
    grsai:
      displayName: GRS AI
      apiKeyEnv: GRS_API_KEY
      api: openai-completions
      # 默认走本地工具调用代理（scripts/grs-tool-proxy.mjs）。
      # 上游仍是 GRS；直连可改回 https://grsaiapi.com/v1（原生 tools 目前不可用）。
      # 国内直连把 .env 的 GRS_BASE_URL / GRS_UPSTREAM_BASE_URL 改成 https://grsai.dakka.com.cn/v1
      baseURL: http://127.0.0.1:18765/v1
      defaultInput: [ text, image ]
      defaultContextWindow: 262144
      defaultMaxTokens: 16384
      timeoutMs: 180000
      streamIdleTimeoutMs: 300000
      retryPolicy:
        mode: normal
        maxRetries: 3
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
        backoff:
          initialDelayMs: 1000
          maxDelayMs: 8000
          jitterRatio: 0.1
      models:
        - id: gemini-3.5-flash
          name: Gemini 3.5 Flash
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 262144
          maxTokens: 32768
          input: [ text, image ]
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
